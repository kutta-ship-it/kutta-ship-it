version: 2

sources:

  - name: mining_source
    database: DQLABS
    schema: SOURCE

    tables:

      - name: COAL_MINING_OPERATIONS

        columns:

          - name: Unit_ID
            tests:
              - not_null

          - name: Mine_ID
            tests:
              - not_null

          - name: Quantity_Tonnes
            tests:
              - not_null

      - name: IRON_MINING_OPERATIONS

        columns:

          - name: Unit_ID
            tests:
              - not_null

          - name: Mine_ID
            tests:
              - not_null

          - name: Quantity_Tonnes
            tests:
              - not_null

      - name: MINE_MASTER

        columns:

          - name: MINE_ID
            tests:
              - unique
              - not_null

      - name: WAREHOUSE_MASTER

        columns:

          - name: WAREHOUSE_ID
            tests:
              - unique
              - not_null

      - name: OPERATOR_MASTER

        columns:

          - name: OPERATOR_ID
            tests:
              - unique
              - not_null

########################################################

models:

########################################################
# STAGING
########################################################

  - name: stg_coal_mining

    columns:

      - name: unit_id
        tests:
          - not_null

      - name: mine_id
        tests:
          - not_null

      - name: quantity_tonnes
        tests:
          - not_null

      - name: total_cost
        tests:
          - not_null

  - name: stg_iron_mining

    columns:

      - name: unit_id
        tests:
          - not_null

      - name: mine_id
        tests:
          - not_null

      - name: quantity_tonnes
        tests:
          - not_null

      - name: total_cost
        tests:
          - not_null

########################################################
# DIMENSIONS
########################################################

  - name: dim_mine

    columns:

      - name: mine_id
        tests:
          - unique
          - not_null

  - name: dim_warehouse

    columns:

      - name: warehouse_id
        tests:
          - unique
          - not_null

  - name: dim_operator

    columns:

      - name: operator_id
        tests:
          - unique
          - not_null

########################################################
# FACT
########################################################

  - name: fact_mining_production

    columns:

      - name: extraction_date
        tests:
          - not_null

      - name: mine_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_mine')
              field: mine_id

      - name: warehouse_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_warehouse')
              field: warehouse_id

      - name: quantity_tonnes
        tests:
          - not_null

      - name: total_cost
        tests:
          - not_null

      - name: mineral_type
        tests:
          - accepted_values:
              values:
                - COAL
                - IRON

      - name: compliance_status
        tests:
          - not_null